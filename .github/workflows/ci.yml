name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://medivi:medivi@localhost:5432/medivi_shop
  BETTER_AUTH_SECRET: ci-only-secret-not-used-in-any-real-environment
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  PAYMENT_PROVIDER: mock

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medivi
          POSTGRES_PASSWORD: medivi
          POSTGRES_DB: medivi_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write env file
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          PAYMENT_PROVIDER=${{ env.PAYMENT_PROVIDER }}
          EOF

      - name: Run migrations
        run: pnpm db:migrate

      - name: Audit dependencies
        # Informational, not a gate — Dependabot (.github/dependabot.yml) is
        # the mechanism for actually acting on these; several existing
        # advisories here have no patched version published yet, so a hard
        # failure would block CI on issues nobody can fix.
        run: pnpm audit --audit-level=high || true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medivi
          POSTGRES_PASSWORD: medivi
          POSTGRES_DB: medivi_shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write env file
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
          PAYMENT_PROVIDER=${{ env.PAYMENT_PROVIDER }}
          EOF

      - name: Run migrations
        run: pnpm db:migrate

      - name: Install Playwright browsers
        run: pnpm --filter @medivi/web exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @medivi/web test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  demo-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @medivi/demo exec playwright install chromium --with-deps

      - name: Run demo E2E tests
        run: pnpm --filter @medivi/demo test:e2e
        env:
          CI: true

      - name: Upload demo Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-playwright-report
          path: apps/demo/playwright-report/
          retention-days: 14
